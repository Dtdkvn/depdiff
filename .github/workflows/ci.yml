name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Node ${{ matrix.node }} quality gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - run: node dist/cli.js demo --output reports/demo.html --json reports/demo.json --sarif reports/demo.sarif --no-fail --quiet
      - run: npm pack --dry-run
      - uses: actions/upload-artifact@v4
        if: matrix.node == 20
        with:
          name: depdiff-demo-report
          path: reports/

  container:
    name: Container smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p reports
      - run: DEPDIFF_UID=$(id -u) DEPDIFF_GID=$(id -g) docker compose run --rm depdiff
      - run: test -s reports/demo.html && test -s reports/demo.sarif
