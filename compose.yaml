services:
  depdiff:
    build:
      context: .
    image: depdiff:local
    user: "${DEPDIFF_UID:-1000}:${DEPDIFF_GID:-1000}"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /work/.depdiff-cache:size=128m,mode=1777
    volumes:
      - ./:/workspace:ro
      - ./reports:/reports
    command:
      - demo
      - --output
      - /reports/demo.html
      - --json
      - /reports/demo.json
      - --sarif
      - /reports/demo.sarif
      - --no-fail
